[package]
name = "subband"
version = "0.1.0"
description = "A memory-safe, pure-Rust JPEG 2000 codec for Second Life textures."
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/chloridian/subband"
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["jpeg2000", "j2c", "decoder", "image", "secondlife"]
categories = ["multimedia::images"]
exclude = ["/benches/", "/tests/", "/fuzz/", "/AGENTS.md", "/CLAUDE.md"]
autotests = false
autobenches = false

[dependencies]
fearless_simd = { version = "1.0.0", optional = true }

[features]
default = ["simd"]
simd = ["fearless_simd"]

[dev-dependencies]
divan = { package = "codspeed-divan-compat", version = "6.0.0" }
png = "0.18.1"

[[test]]
name = "tests"
path = "tests/main.rs"

[[bench]]
name = "main"
harness = false

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "deny"

[lints.clippy]
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
absolute_paths = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
redundant_clone = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
too_many_arguments = "allow"
large_enum_variant = "allow"
upper_case_acronyms = "allow"
collection_is_never_read = "warn"
default_trait_access = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"
